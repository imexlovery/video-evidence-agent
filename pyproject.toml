[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-evidence-agent"
version = "0.1.0"
description = "P0-A Chinese video transcript evidence retrieval smoke test"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=1.28.0",
    "mlx-whisper>=0.4.3",
    "openai>=3.3.1",
    "opencc-python-reimplemented>=0.1.7",
    "pydantic>=2.13.4",
    "pysubs2>=1.9.0",
    "python-dotenv>=1.2.3",
    "rapidocr-onnxruntime>=1.4.4",
    "scikit-learn>=1.9.0",
]

[project.scripts]
video-evidence = "video_evidence_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
